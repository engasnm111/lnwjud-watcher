name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  web:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cd dist && zip -r ../lnwjud-watcher-web.zip .
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: web
          path: lnwjud-watcher-web.zip

  desktop-windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:pack:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke test packaged Windows runtime
        run: node scripts/verify-windows-package.mjs
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-windows
          path: release-desktop/lnwjud-watcher-windows-x64.exe

  desktop-macos:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:pack:mac:${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: bash scripts/verify-macos-package.sh "${{ matrix.arch }}"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: release-desktop/lnwjud-watcher-macos-${{ matrix.arch }}.dmg

  desktop-linux:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:pack:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke test packaged Linux runtime
        run: |
          test -s release-desktop/lnwjud-watcher-linux-x64.AppImage
          test -s release-desktop/lnwjud-watcher-linux-x64.tar.gz
          chmod +x release-desktop/lnwjud-watcher-linux-x64.AppImage
          release-desktop/lnwjud-watcher-linux-x64.AppImage --appimage-extract >/dev/null
          result="$(ELECTRON_RUN_AS_NODE=1 ./squashfs-root/lnwjud-watcher -e 'process.stdout.write("watcher-runtime-ok")')"
          test "$result" = "watcher-runtime-ok"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-linux
          path: |
            release-desktop/lnwjud-watcher-linux-x64.AppImage
            release-desktop/lnwjud-watcher-linux-x64.tar.gz

  android:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Restore Android release signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.WATCHER_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/watcher-release.jks"
      - name: Build signed Android release
        run: |
          chmod +x gradlew
          VERSION=$(node -p "require('../package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          BASE=$(( (MAJOR + 1) * 100000000 + MINOR * 1000000 + PATCH * 10000 ))
          export WATCHER_ANDROID_VERSION_CODE=$(( BASE + GITHUB_RUN_NUMBER % 10000 ))
          echo "Building Android versionName=$VERSION versionCode=$WATCHER_ANDROID_VERSION_CODE"
          ./gradlew assembleRelease
        working-directory: android
        env:
          WATCHER_ANDROID_KEYSTORE: ${{ runner.temp }}/watcher-release.jks
          WATCHER_ANDROID_KEY_ALIAS: ${{ secrets.WATCHER_ANDROID_KEY_ALIAS }}
          WATCHER_ANDROID_KEY_PASSWORD: ${{ secrets.WATCHER_ANDROID_KEY_PASSWORD }}
          WATCHER_ANDROID_STORE_PASSWORD: ${{ secrets.WATCHER_ANDROID_STORE_PASSWORD }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk lnwjud-watcher-android.apk
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: android
          path: lnwjud-watcher-android.apk

  ios:
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - run: ditto -c -k --sequesterRsrc --keepParent ios/build/Build/Products/Debug-iphonesimulator/App.app lnwjud-watcher-ios-simulator.zip
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ios
          path: lnwjud-watcher-ios-simulator.zip

  publish:
    needs: [web, desktop-windows, desktop-macos, desktop-linux, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release version and write checksums
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test "$TAG_NAME" = "v$(node -p "require('./package.json').version")"
          cd release-assets
          sha256sum lnwjud-watcher-* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" release-assets/* --verify-tag --title "lnwjud Watcher $TAG_NAME" --notes-file RELEASE_NOTES.md
