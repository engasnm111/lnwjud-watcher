    <text x="28" y="130" class="th muted" font-size="20">Wait for macOS x64 rerun to terminal…</text>
    <text x="28" y="177" class="th white" font-size="18" font-weight="700">เป้าหมาย 2 · เอเจนต์ 0 · งาน 0</text>
    <text x="28" y="210" class="th muted" font-size="17">ทำ 3 นาทีที่แล้ว · ซิงก์ 0 นาทีที่แล้ว</text>
