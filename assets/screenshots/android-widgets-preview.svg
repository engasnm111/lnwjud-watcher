<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="90%">
      <stop stop-color="#382032"/><stop offset=".52" stop-color="#152538"/><stop offset="1" stop-color="#09131d"/>
    </radialGradient>
    <style>
      .th{font-family:Prompt,Arial,sans-serif}.white{fill:#f5f2e9}.muted{fill:#a9b4c2}.gold{fill:#f4b93f}.green{fill:#45d89a}
    </style>
  </defs>
  <rect width="1200" height="760" rx="38" fill="url(#bg)"/>
  <text x="60" y="78" class="th white" font-size="40" font-weight="700">lnwjud Watcher · Android widgets</text>
